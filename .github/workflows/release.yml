name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate.py
      - run: npm test
      - run: python scripts/release_artifacts.py
      - run: python scripts/smoke_npm.py
      - run: python -m twine check dist/archclt-*.whl dist/archclt-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
  github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - run: gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_REGISTRIES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - run: mkdir python-dist && cp dist/archclt-*.whl dist/archclt-*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
  npm:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_REGISTRIES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - run: npm publish dist/archclt-archctl-*.tgz --access public
