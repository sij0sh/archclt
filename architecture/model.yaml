verification:
- id: module-boundaries
  kind: architecture
  command:
  - python3
  - -m
  - unittest
  - tests.test_architecture
  - -v
  cwd: .
  timeout_seconds: 30
  components:
  - core
  - package
  - entrypoint
  - atlas
  - guard
  - observatory
  - integrations
  - templates
  - cli
- id: regression-suite
  kind: integration
  command:
  - python3
  - -m
  - unittest
  - discover
  - -s
  - tests
  - -v
  cwd: .
  timeout_seconds: 90
  components:
  - core
  - package
  - entrypoint
  - atlas
  - guard
  - observatory
  - integrations
  - templates
  - cli
- id: workflow-demo
  kind: workflow
  command:
  - python3
  - scripts/demo.py
  cwd: .
  timeout_seconds: 30
  components:
  - core
  - package
  - entrypoint
  - atlas
  - guard
  - observatory
  - integrations
  - templates
  - cli
workflows:
- id: cli-release
  participants:
  - entrypoint
  - cli
  verification:
  - workflow-demo
  decision: ADR-001
enforcement: strict
