schema_version: archctl.authoring.v2
system_id: archctl
name: Architecture Control Plane
domains:
- id: architecture
  name: Architecture tooling
  owners:
  - maintainers
components:
- id: core
  name: Core
  domain: architecture
  kind: library
  paths:
  - src/archctl/core/**
- id: package
  name: Package root
  domain: architecture
  kind: library
  paths:
  - src/archctl/__init__.py
- id: entrypoint
  name: Entrypoint
  domain: architecture
  kind: service
  paths:
  - src/archctl/__main__.py
- id: atlas
  name: Atlas
  domain: architecture
  kind: library
  paths:
  - src/archctl/atlas/**
- id: guard
  name: Guard
  domain: architecture
  kind: library
  paths:
  - src/archctl/guard/**
- id: observatory
  name: Observatory
  domain: architecture
  kind: library
  paths:
  - src/archctl/observatory/**
- id: integrations
  name: Integrations
  domain: architecture
  kind: library
  paths:
  - src/archctl/integrations/**
- id: templates
  name: Templates
  domain: architecture
  kind: library
  paths:
  - src/archctl/templates.py
- id: cli
  name: Cli
  domain: architecture
  kind: service
  paths:
  - src/archctl/cli.py
  - src/archctl/cli_gate.py
  - src/archctl/cli_report.py
