[build-system]
requires = ["setuptools>=77", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "archclt"
dynamic = ["version"]
description = "Architectural context, memory and verification for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Josh Simon"}]
dependencies = ["PyYAML>=6.0,<7"]
keywords = ["architecture", "agents", "verification", "cli"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development"]

[project.urls]
Repository = "https://github.com/sij0sh/archclt"
Documentation = "https://github.com/sij0sh/archclt/tree/main/docs"
Issues = "https://github.com/sij0sh/archclt/issues"
Changelog = "https://github.com/sij0sh/archclt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5", "setuptools>=77", "wheel>=0.41", "build>=1.2", "twine>=6"]

[project.scripts]
archctl = "archctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "archctl.__version__"}
